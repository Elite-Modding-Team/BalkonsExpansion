apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    exclusiveContent {
        forRepository {
            maven {
                name 'CleanroomMC CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // Include StripLatestForgeRequirements by default for the dev env, saves everyone a hassle
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // Had Enough Items
    implementation rfg.deobf('curse.maven:had-enough-items-557549:8648715')

    // Applied Energistics 2
    implementation rfg.deobf('curse.maven:ae2-extended-life-570458:6302098')

    // Balkon's WeaponMod Legacy
    implementation rfg.deobf('curse.maven:balkons-weaponmod-legacy-1033985:8523022')

    // Baubles
    implementation rfg.deobf('curse.maven:baubles-227083:2518667')

    // Better With Mods
    implementation rfg.deobf('curse.maven:bwm-suite-246760:5702821')

    // Defiled Lands
    implementation rfg.deobf('curse.maven:defiled-lands-273502:2835318')

    // Galacticraft Legacy
    compileOnly 'curse.maven:galacticraft-legacy-564236:4671122'

    // Ice and Fire - LLibrary MUST be 1.7.9 or it'll crash during testing
    //implementation rfg.deobf('curse.maven:ice-and-fire-dragons-264231:2939529')
    implementation rfg.deobf('curse.maven:ice-and-fire-rotn-edition-457668:5738729')
    implementation rfg.deobf('curse.maven:LLibrary-243298:2504999')

    // IC2 Classic
    implementation rfg.deobf('curse.maven:ic2-classic-242942:5800761')

    // Immersive Engineering
    implementation rfg.deobf('curse.maven:immersive-engineering-231951:2974106')

    // Misty World
    implementation rfg.deobf('curse.maven:misty-world-unveiled-1104150:6987174')

    // Mo' Creatures Extended
    implementation rfg.deobf('curse.maven:mo-creatures-extended-867351:6984289')

    // Patchouli
    implementation rfg.deobf('curse.maven:patchouli-rofl-edition-905159:6178311')

    // Project Red
    compileOnly 'curse.maven:codechickenlib-242818:2779848'
    compileOnly 'curse.maven:mrtjpcore-229002:2735197'
    compileOnly 'curse.maven:forgemultipartcbe-258426:2755790'
    compileOnly 'curse.maven:projectredbase-228702:2745545'
    compileOnly 'curse.maven:projectredworld-229049:2745551'

    // Railcraft
    compileOnly 'curse.maven:railcraft-51195:3853491'

    // Thaumcraft
    implementation rfg.deobf('curse.maven:thaumcraft-223628:2629023')

    // TODO: Mod integration dependencies should be optional when running
    def modMap = [:]
    def loadMap = [:]

    loadMap.clear()
    modMap.each{mods, load -> {
        boolean loadFlag = load.toBoolean()
        mods.each{mod ->
            if(!loadMap.containsKey(mod)) {
                loadMap.put(mod,loadFlag)
            } else {
                if(loadFlag && !loadMap[mod]) {
                    loadMap[mod] = loadFlag
                }
            }
        }
    }}

    loadMap.each{maven,load -> {
        if(load) {
            implementation(rfg.deobf(maven))
        } else {
            compileOnly(rfg.deobf(maven))
        }
    }}

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Deobfuscating dependencies:
    // rfg.deobf('curse.maven:had-enough-items-557549:4543375')
    // By wrapping a dependency descriptor in rfg.deobf() method call, the dependency is queued for deobfuscation
    // When deobfuscating, RFG respects the mapping_channel + mapping_version stated in gradle.properties

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // embed = bundle dependencies into final output artifact (no relocation)

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }
}